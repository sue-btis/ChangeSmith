  PLANTILLA DE DIAGRAMA DE ARQUITECTURA
  =====================================
  Reemplaza los marcadores NOMBRE-DEL-SISTEMA y las zonas de ejemplo.
  Conserva la hoja de estilos, los <defs> y la leyenda: son la parte reutilizable.

  REJILLA (viewBox 1560 x alto-segun-contenido)
  ---------------------------------------------
    marco exterior      x  8 .. 1552
    canal izquierdo     x 32 .. 60      <- para flechas verticales largas (usar x=42)
    columna ancha       x 60 .. 908
    pasillo             x 908 .. 938    <- para flechas verticales (usar x=922)
    columna angosta     x 938 .. 1508

    barra de cabecera   y  8 .. 66
    contenedor          y 86 .. (alto - 84)
    primera fila        y 130 ..
    leyenda             y (alto - 38)

  CAJA DE RECURSO ESTANDAR
  ------------------------
    <rect class="card" x="X" y="Y" width="W" height="H" rx="7"/>
    <use href="#ic-XXX" x="X+18" y="Y+20"/>          icono 40x40
    <text class="n-name" x="X+72" y="Y+27">Titulo</text>
    <text class="n-id"   x="X+72" y="Y+45">nombre-del-recurso</text>
    <text class="n-sub"  x="X+72" y="Y+63">detalle</text>
    <text class="n-note" x="X+72" y="Y+81">nota en itálica</text>

  Deja pasillos entre zonas y traza las flechas por ahí. Termina cada flecha
  de 4 a 8 px antes del borde de destino para que la punta respire.
-->
