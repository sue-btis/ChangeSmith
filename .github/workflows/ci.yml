name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The hooks parse Windows and POSIX paths, so the tests run on both.
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node --test "**/*.test.mjs"
