name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The hooks parse Windows and Git Bash paths, so the tests run where the hooks do.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node --test "**/*.test.mjs"
